services:
  mcp-server:
    build:
      context: apps/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - sqlite-data:/data
    env_file:
      - apps/mcp-server/.env
    environment:
      DATABASE_PATH: /data/salon.db
      MCP_PORT: "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/sse"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent-server:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - apps/backend/.env
    environment:
      MCP_SERVER_URL: http://mcp-server:8001
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
